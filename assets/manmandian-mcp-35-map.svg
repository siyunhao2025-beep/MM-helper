<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">慢慢点麦当劳 MCP 三十五项工具生活任务地图</title>
  <desc id="desc">三十五项工具分成点餐核价、账户优惠、订单售后、外送地址、团餐活动、积分商城、抽奖奖品、营养时间八条路线；二十八项读取与核价能力按意图使用，七项状态变更能力进入引导模式，决定始终交给用户。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9e8"/>
      <stop offset="1" stop-color="#fff0df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7d3b27" flood-opacity="0.13"/>
    </filter>
    <style>
      .zh{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#3d2c28}
      .card{fill:#fffdf8;stroke:#f2c777;stroke-width:3}
      .route{stroke:#e7aa45;stroke-width:5;stroke-linecap:round;stroke-dasharray:7 13;opacity:.75}
      .h{font-size:31px;font-weight:700}
      .small{font-size:21px;fill:#72574e}
      .count{font-size:25px;font-weight:700;fill:#c33b2f}
      .footer{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;fill:#fffaf0}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
